<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="100%" stop-color="#e8f8f5" />
      </linearGradient>
      <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#16a085" />
        <stop offset="100%" stop-color="#1abc9c" />
      </linearGradient>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12" />
      </filter>
    </defs>
    
    <!-- Background Card -->
    <rect width="400" height="260" fill="#faf8f5" rx="16" />
    
    <!-- Contact Lens Box Package -->
    <g filter="url(#shadow)">
      <rect x="40" y="35" width="320" height="190" rx="14" fill="url(#bg)" stroke="#e5e0d8" stroke-width="1.5" />
      
      <!-- Brand Bar -->
      <rect x="40" y="35" width="320" height="40" rx="14" fill="#ffffff" fill-opacity="0.85" />
      <text x="60" y="60" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#222222" letter-spacing="1.5">COOPER VISION</text>
      <text x="340" y="60" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#888888" text-anchor="end">STERILE 3D</text>

      <!-- Decorative Graphics / Wave Rings -->
      <circle cx="300" cy="140" r="50" fill="none" stroke="url(#accent)" stroke-width="8" stroke-dasharray="10 6" opacity="0.8" />
      <circle cx="300" cy="140" r="32" fill="none" stroke="url(#accent)" stroke-width="5" opacity="0.6" />
      
      <!-- Lens Circle/Iris Graphic -->
      <circle cx="300" cy="140" r="18" fill="#16a085" opacity="0.3"/>

      <!-- Title Text -->
      <text x="60" y="125" font-family="'Cormorant Garamond', serif" font-size="22" font-weight="700" fill="#1c1c1c">ultraflex plus</text>
      <text x="60" y="148" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#555555">Daily Disposable 1-DAY</text>
      
      <!-- Features Pill -->
      <rect x="60" y="172" width="110" height="22" rx="11" fill="url(#accent)" />
      <text x="115" y="187" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">CONTACT LENSES</text>
    </g>
  </svg>